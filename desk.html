<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Пуск · щит</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: #0c0c0e; color: #eee; }
    main { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .35rem; }
    .muted { color: #9a9aa3; font-size: .85rem; }
    button { appearance: none; border: 0; border-radius: 999px; padding: .55rem 1rem; background: #f4f4f5; color: #111; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .45; cursor: wait; }
    .card { margin-top: 1rem; padding: 1rem 1.1rem; border-radius: 1rem; background: #16161a; border: 1px solid #2a2a30; }
    .ok { color: #8ee0b0; }
    .bad { color: #f0a0a0; }
    ul { list-style: none; margin: .75rem 0 0; padding: 0; }
    li.mod { padding: .85rem 0 0.35rem; border-top: 1px solid #2a2a30; }
    li.mod:first-child { border-top: 0; padding-top: 0; }
    .head { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: .35rem; }
    .sku { font-weight: 600; }
    .ch { color: #9a9aa3; font-size: .8rem; white-space: nowrap; }
    .channels { margin: 0; }
    .channels li { display: flex; align-items: center; gap: .75rem; padding: .35rem 0; border-top: 0; }
    .knob { color: #9a9aa3; font-size: .8rem; min-width: 4.5rem; flex: none; }
    input[type="text"] { width: 100%; box-sizing: border-box; border: 0; border-bottom: 1px solid #3a3a42; background: transparent; color: #eee; font: inherit; font-weight: 600; padding: 0 0 .15rem; outline: none; }
    input[type="text"]::placeholder { color: #6e6e78; font-weight: 500; }
    input[type="text"]:focus { border-bottom-color: #8ee0b0; color: #fff; }
    .from-rules { color: #6e6e78; font-size: .7rem; }
    .kind { color: #6e6e78; font-size: .7rem; white-space: nowrap; }
    .orphan { color: #f0a0a0; }
    #poured li { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: .4rem 0; border-top: 1px solid #2a2a30; }
    #poured li:first-child { border-top: 0; }
  </style>
</head>
<body>
  <main>
    <p class="muted">Локальный стол · как HA на :8123</p>
    <h1>Пусконаладка щита</h1>
    <p class="muted">Имя — на контакте. Залитое с щита видно ниже: что есть и что поправить. Новую заливку не делаем.</p>
    <p style="margin-top:1rem"><button id="scan" type="button">Снять шину</button></p>
    <div class="card">
      <p id="health" class="muted">Спрашиваю агента…</p>
    </div>
    <div class="card">
      <p id="bus" class="muted">Шина ещё не снимали.</p>
      <ul id="shelves"></ul>
    </div>
    <div class="card">
      <p id="pouredHead" class="muted">Спрашиваю залитое…</p>
      <ul id="poured"></ul>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let liveKeys = {};
    let pouredRules = [];
    function kindRu(k) {
      if (k === "marking") return "разметка";
      if (k === "user") return "сценарий";
      return "ядро";
    }
    function contactLine(c) {
      return (c.label || c.deviceTopicKey) + " · " + c.controlId;
    }
    function renderPoured() {
      const ul = $("poured");
      ul.innerHTML = "";
      pouredRules.forEach((r) => {
        const li = document.createElement("li");
        const left = document.createElement("div");
        const title = document.createElement("div");
        title.textContent = r.title || r.id;
        const sub = document.createElement("div");
        sub.className = "muted";
        const bits = (r.contacts || []).map(contactLine);
        const missing = (r.contacts || []).filter((c) => liveKeys.ready && !liveKeys[c.deviceTopicKey]);
        sub.textContent = bits.join(", ") || "нет контакта на шине";
        if (missing.length) {
          sub.className = "muted orphan";
          sub.textContent = bits.join(", ") + " · нет на этой шине";
        }
        left.appendChild(title);
        left.appendChild(sub);
        const kind = document.createElement("span");
        kind.className = "kind";
        kind.textContent = kindRu(r.kind);
        li.appendChild(left);
        li.appendChild(kind);
        ul.appendChild(li);
      });
    }
    async function loadHealth() {
      try {
        const r = await fetch("/runtime/health");
        const j = await r.json();
        const en = j.enrollment && j.enrollment.state ? j.enrollment.state : "—";
        const topics = j.mqttMirror && j.mqttMirror.topicCount;
        const ver = String(j.agentVersion || "").replace(/^.*\./, "");
        const rules = j.rulesInventory && j.rulesInventory.userDefineRuleCount;
        $("health").className = j.ok ? "ok" : "bad";
        $("health").textContent = j.ok
          ? "Агент на щите · enroll " + en + (ver ? " · " + ver : "") + (topics != null ? " · зеркало " + topics + " топиков" : "") + (rules ? " · rules " + rules : "")
          : "Агент не ответил";
      } catch (e) {
        $("health").className = "bad";
        $("health").textContent = "Нет /runtime/health — откройте этот адрес с машины в сети щита.";
      }
    }
    async function saveName(key, controlId, name) {
      await fetch("/runtime/desk-marking", {
        method: "PUT",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ deviceTopicKey: key, controlId: controlId, name: name }),
      });
    }
    function renderShelves(rows) {
      const ul = $("shelves");
      ul.innerHTML = "";
      (rows || []).forEach((s) => {
        const li = document.createElement("li");
        li.className = "mod";
        const head = document.createElement("div");
        head.className = "head";
        const sku = document.createElement("span");
        sku.className = "sku";
        sku.textContent = s.label || s.deviceTopicKey;
        const meta = document.createElement("span");
        meta.className = "ch";
        meta.textContent = s.hint || (s.channelCount ? s.channelCount + " кан." : "");
        head.appendChild(sku);
        head.appendChild(meta);
        li.appendChild(head);
        const chs = document.createElement("ul");
        chs.className = "channels";
        (s.channels || []).forEach((ch) => {
          const row = document.createElement("li");
          const knob = document.createElement("span");
          knob.className = "knob";
          knob.textContent = ch.controlId;
          const input = document.createElement("input");
          input.type = "text";
          input.maxLength = 80;
          input.placeholder = "Имя контакта";
          input.value = ch.name || "";
          input.setAttribute("aria-label", (s.label || "") + " " + ch.controlId);
          const persist = () => saveName(s.deviceTopicKey, ch.controlId, input.value).catch(() => {});
          input.addEventListener("change", persist);
          input.addEventListener("blur", persist);
          row.appendChild(knob);
          row.appendChild(input);
          if (ch.source === "rules" && ch.name) {
            const tag = document.createElement("span");
            tag.className = "from-rules";
            tag.textContent = "rules";
            row.appendChild(tag);
          }
          chs.appendChild(row);
        });
        li.appendChild(chs);
        ul.appendChild(li);
      });
    }
    async function scanNow() {
      $("scan").disabled = true;
      try {
        const r = await fetch("/runtime/mqtt-scan", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ instant: true }),
        });
        const j = await r.json();
        if (!j.ok) {
          if (!$("shelves").children.length) {
            $("bus").className = "bad";
            $("bus").textContent = j.error || "Скан не вышел";
          }
          return;
        }
        if (j.shelves && j.shelves.length) showShelves(j);
      } catch (e) {
        if (!$("shelves").children.length) {
          $("bus").className = "bad";
          $("bus").textContent = String(e.message || e);
        }
      } finally {
        $("scan").disabled = false;
      }
    }
    $("scan").onclick = () => { void scanNow(); };
    function showShelves(j) {
      const shelves = j.shelves || [];
      $("bus").className = "ok";
      const named = shelves.reduce(function (n, s) {
        return n + (s.channels || []).filter(function (c) { return c.source === "rules" && c.name; }).length;
      }, 0);
      $("bus").textContent = "На шине " + shelves.length + " модулей" +
        (j.brokerLabel ? " · " + j.brokerLabel : "") +
        (named ? " · " + named + " имён из rules" : "");
      renderShelves(shelves);
      liveKeys = { ready: true };
      shelves.forEach((s) => { liveKeys[s.deviceTopicKey] = true; });
      renderPoured();
      if (shelves.length) $("scan").textContent = "Обновить шину";
    }
    async function loadPoured() {
      try {
        const r = await fetch("/runtime/desk-poured");
        const j = await r.json();
        if (!j.ok) {
          $("pouredHead").className = "bad";
          $("pouredHead").textContent = j.error || "Не прочитал залитое";
          return;
        }
        pouredRules = j.rules || [];
        const files = (j.files || []).map((f) => f.filename).join(", ");
        $("pouredHead").className = "ok";
        $("pouredHead").textContent = "Залито на щит · " + (j.ruleCount || pouredRules.length) + " правил" +
          (j.revisionId ? " · " + String(j.revisionId).slice(0, 12) : "") +
          (files ? " · " + files : "");
        renderPoured();
      } catch (e) {
        $("pouredHead").className = "bad";
        $("pouredHead").textContent = String(e.message || e);
      }
    }
    async function loadLast() {
      try {
        const r = await fetch("/runtime/mqtt-scan");
        const j = await r.json();
        if (j.ok && j.shelves && j.shelves.length) showShelves(j);
      } catch (_) { /* зеркало ниже */ }
      await scanNow();
    }
    loadHealth();
    loadPoured();
    loadLast();
  </script>
</body>
</html>
