<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Пуск · щит</title>
  <style>
    :root {
      color-scheme: dark;
      --sky: 56 189 248;
      --sky-strong: 14 165 233;
      --ok: 52 211 153;
      --bad: 248 113 113;
      --ink: 245 245 247;
      --mute: 161 161 170;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(1200px 480px at 50% -80px, rgb(var(--sky) / .14), transparent 60%),
        #000;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 42rem; margin: 0 auto; padding: 1.25rem 1.15rem 9.5rem; }
    .kicker { margin: 0; color: var(--mute); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
    .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin: .35rem 0 1rem; }
    h1 { font-size: 1.85rem; font-weight: 650; letter-spacing: -.03em; margin: 0; }
    .ghost {
      appearance: none; border: 0; cursor: pointer;
      padding: .45rem .9rem; border-radius: 999px; font: inherit; font-weight: 600; font-size: .85rem;
      color: rgb(var(--sky-strong));
      background: rgb(var(--sky) / .12);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / .14);
    }
    .ghost:disabled { opacity: .45; cursor: wait; }
    .glass {
      border-radius: 1.15rem;
      background: linear-gradient(180deg, rgb(255 255 255 / .09), rgb(255 255 255 / .03));
      border: 1px solid rgb(255 255 255 / .1);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / .14), 0 12px 40px -18px rgb(0 0 0 / .55);
      backdrop-filter: blur(24px);
    }
    .status { display: flex; align-items: center; gap: .65rem; padding: .7rem .95rem; margin-bottom: 1rem; }
    .dot { width: .55rem; height: .55rem; border-radius: 99px; background: #52525b; flex: none; }
    .ok .dot { background: rgb(var(--ok)); box-shadow: 0 0 12px rgb(var(--ok) / .7); }
    .bad .dot { background: rgb(var(--bad)); box-shadow: 0 0 12px rgb(var(--bad) / .55); }
    .status p { margin: 0; font-size: .82rem; color: var(--mute); }
    .ok p { color: rgb(var(--ok)); }
    .bad p { color: rgb(var(--bad)); }
    .panel { padding: 1rem 1.1rem 1.5rem; }
    .panel[hidden] { display: none; }
    .meta { margin: 0 0 .65rem; color: var(--mute); font-size: .82rem; }
    ul { list-style: none; margin: 0; padding: 0; }
    li.mod { padding: .95rem 0 .4rem; border-top: 1px solid rgb(255 255 255 / .08); }
    li.mod:first-child { border-top: 0; padding-top: .15rem; }
    .head { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: .4rem; }
    .sku { font-weight: 600; letter-spacing: -.01em; }
    .ch { color: var(--mute); font-size: .78rem; white-space: nowrap; }
    .channels li { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr); gap: .15rem .7rem; padding: .42rem 0; align-items: start; }
    .channels li.roomh {
      display: block;
      padding: .7rem 0 .05rem;
      color: var(--mute);
      font-size: .72rem;
    }
    .channels li.roomh:first-child { padding-top: .1rem; }
    .knob { color: var(--mute); font-size: .78rem; min-width: 0; padding-top: .28rem; }
    input[type="text"] {
      width: 100%; border: 0; border-bottom: 1px solid rgb(255 255 255 / .12);
      background: transparent; color: var(--ink); font: inherit; font-weight: 600;
      padding: .1rem 0 .2rem; outline: none;
    }
    input[type="text"]::placeholder { color: #71717a; font-weight: 500; }
    input[type="text"]:focus {
      border-bottom-color: rgb(var(--sky));
      box-shadow: 0 8px 18px -12px rgb(var(--sky) / .8);
    }
    .from-rules, .kind { color: rgb(var(--sky) / .85); font-size: .68rem; }
    .from-rules { display: block; margin-top: .12rem; }
    .chips { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .35rem; }
    .chip {
      appearance: none; border: 0; cursor: pointer;
      padding: .18rem .55rem; border-radius: 999px;
      font: inherit; font-size: .68rem; font-weight: 600;
      color: var(--mute);
      background: rgb(255 255 255 / .05);
    }
    .chip { opacity: .42; }
    .chip[aria-pressed="true"] {
      opacity: 1;
      color: rgb(186 230 253);
      background: rgb(var(--sky) / .16);
      box-shadow: 0 0 12px rgb(var(--sky) / .22);
    }
    .loads { display: block; margin-top: .2rem; color: var(--mute); font-size: .72rem; }
    #bus .gapjump {
      appearance: none; border: 0; background: none; padding: 0;
      font: inherit; color: rgb(var(--sky) / .9); cursor: pointer;
    }
    .orphan { color: rgb(var(--bad)); }
    #gaps li { cursor: pointer; }
    #gaps li:focus { outline: 1px solid rgb(var(--sky) / .45); border-radius: .4rem; }
    .channels li.jump {
      outline: 1px solid rgb(var(--sky) / .5);
      border-radius: .45rem;
    }
    #poured li.roomh, #gaps li.roomh {
      display: block; border-top: 0; padding: .85rem 0 .15rem;
      color: var(--mute); font-size: .72rem;
    }
    #poured li, #preview li, #pouredMarks li, #gaps li { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: .55rem 0; border-top: 1px solid rgb(255 255 255 / .08); }
    #poured li:first-child, #preview li:first-child, #pouredMarks li:first-child, #gaps li:first-child { border-top: 0; }
    details.more { margin: .1rem 0 .35rem; }
    details.more summary { color: var(--mute); font-size: .8rem; cursor: pointer; }
    .empty { margin: 2.5rem 1rem; text-align: center; color: var(--mute); }
    .dock {
      position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
      width: min(42rem, 100%);
      padding: .45rem .7rem calc(.55rem + env(safe-area-inset-bottom));
      background: rgb(10 10 12 / .78);
      border-top: 1px solid rgb(255 255 255 / .08);
      backdrop-filter: blur(28px);
      display: grid; grid-template-columns: repeat(4, 1fr); gap: .2rem;
    }
    .tab {
      appearance: none; border: 0; background: transparent; color: #8e8e96;
      cursor: pointer; padding: .35rem .2rem .25rem; border-radius: .85rem;
      display: flex; flex-direction: column; align-items: center; gap: .22rem;
      font: inherit; font-size: .62rem; font-weight: 600; letter-spacing: .01em;
    }
    .tab .ico {
      width: 1.85rem; height: 1.85rem; border-radius: .55rem;
      display: grid; place-items: center;
      background: linear-gradient(180deg, rgb(255 255 255 / .14), rgb(255 255 255 / .04));
      border: 1px solid rgb(255 255 255 / .1);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / .22);
    }
    .tab svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .tab .n { font-variant-numeric: tabular-nums; }
    .tab[aria-selected="true"] { color: #fff; }
    .tab[aria-selected="true"] .ico {
      color: rgb(186 230 253);
      border-color: rgb(var(--sky) / .45);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / .3), 0 0 16px rgb(var(--sky) / .35);
    }
    @media (prefers-reduced-motion: reduce) {
      .ghost, .tab .ico, input[type="text"] { box-shadow: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Локальный стол</p>
    <div class="top">
      <h1>Пуск щита</h1>
      <button id="scan" class="ghost" type="button">Обновить</button>
    </div>
    <div id="health" class="glass status">
      <span class="dot" aria-hidden="true"></span>
      <p>Спрашиваю агента…</p>
    </div>
    <section id="panel-light" class="panel glass" data-tab="light">
      <p id="bus" class="meta">Шина ещё не снимали.</p>
      <ul id="shelves-light"></ul>
    </section>
    <section id="panel-buttons" class="panel glass" hidden data-tab="buttons">
      <p class="meta">Входы MCM и GPIO — кнопки сценариев.</p>
      <ul id="shelves-buttons"></ul>
    </section>
    <section id="panel-relays" class="panel glass" hidden data-tab="relays">
      <p class="meta">Силовые K. Имена появятся, когда линия попадёт в заливку.</p>
      <ul id="shelves-relays"></ul>
    </section>
    <section id="panel-poured" class="panel glass" hidden data-tab="poured">
      <p id="previewHead" class="meta">Сравниваю стол с диском…</p>
      <p style="margin:0 0 .75rem"><button id="pour" class="ghost" type="button" disabled>Залить</button></p>
      <ul id="preview"></ul>
      <p id="gapsHead" class="meta" hidden></p>
      <ul id="gaps"></ul>
      <p id="pouredHead" class="meta">Спрашиваю залитое…</p>
      <ul id="poured"></ul>
      <details id="pouredMarksWrap" class="more" hidden>
        <summary id="pouredMarksSum"></summary>
        <ul id="pouredMarks"></ul>
      </details>
    </section>
  </main>
  <nav class="dock" role="tablist" aria-label="Разделы пуска">
    <button class="tab" type="button" role="tab" data-tab="light" aria-selected="true">
      <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></span>
      <span>Свет <span class="n" id="n-light"></span></span>
    </button>
    <button class="tab" type="button" role="tab" data-tab="buttons" aria-selected="false">
      <span class="ico"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3"/><circle cx="8" cy="12" r="2"/><path d="M14 10h4M14 14h2"/></svg></span>
      <span>Кнопки <span class="n" id="n-buttons"></span></span>
    </button>
    <button class="tab" type="button" role="tab" data-tab="relays" aria-selected="false">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3v3M8 8H5a2 2 0 0 0-2 2v7h18v-7a2 2 0 0 0-2-2h-3"/><rect x="8" y="3" width="8" height="5" rx="1"/><path d="M8 21h8"/></svg></span>
      <span>Реле <span class="n" id="n-relays"></span></span>
    </button>
    <button class="tab" type="button" role="tab" data-tab="poured" aria-selected="false">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 20V8"/><path d="m6 14 6 6 6-6"/><path d="M4 4h16"/></svg></span>
      <span>Залито <span class="n" id="n-poured"></span></span>
    </button>
  </nav>
  <script>
    const $ = (id) => document.getElementById(id);
    let liveKeys = {};
    let pouredRules = [];
    let lastShelvesRows = [];
    let lastGapCount = 0;
    let activeTab = "light";
    const CARDS = [
      { id: "light_button_toggle", ru: "Переключение" },
      { id: "light_dim_hold_mcm", ru: "Дим-удержание" },
      { id: "light_all_off", ru: "Все выкл" },
    ];
    function enrollRu(s) {
      if (s === "restored" || s === "online" || s === "enrolled_awaiting_heartbeat") return "на связи";
      if (s === "enrolling") return "подключаюсь";
      if (s === "enroll_failed" || s === "enroll_transient") return "нет связи";
      return s || "—";
    }
    function kindRu(k) {
      if (k === "marking") return "разметка";
      if (k === "user") return "сценарий";
      return "ядро";
    }
    function contactLine(c) {
      return (c.label || c.deviceTopicKey) + " · " + c.controlId;
    }
    function familyOf(s) {
      const k = String(s.deviceTopicKey || "");
      if (/led|ampled|dali|mdm/i.test(k)) return "light";
      if (/mcm|gpio|mdi/i.test(k)) return "buttons";
      return "relays";
    }
    function splitShelves(rows) {
      const out = { light: [], buttons: [], relays: [] };
      (rows || []).forEach((s) => out[familyOf(s)].push(s));
      return out;
    }
    function setTab(tab) {
      activeTab = tab;
      document.querySelectorAll(".tab").forEach((btn) => {
        btn.setAttribute("aria-selected", btn.dataset.tab === tab ? "true" : "false");
      });
      document.querySelectorAll(".panel").forEach((p) => {
        p.hidden = p.dataset.tab !== tab;
      });
      if (location.hash.replace("#", "") !== tab) history.replaceState(null, "", "#" + tab);
    }
    function previewStatusRu(s) {
      if (s === "blocked") return "без имени — не зальём";
      if (s === "name") return "имя";
      if (s === "new_name") return "новое имя";
      if (s === "card") return "карточка";
      if (s === "no_card") return "нет карточки";
      return s;
    }
    function shelfLabel(key) {
      const s = lastShelvesRows.find((r) => r.deviceTopicKey === key);
      return (s && s.label) || key;
    }
    function previewRow(r, room) {
      const li = document.createElement("li");
      const left = document.createElement("div");
      const title = document.createElement("div");
      const label = room ? titleUnderRoom(r.name || "без имени", room) : (r.name || "без имени");
      title.textContent = label + (r.cards && r.cards.length ? " · " + r.cards.join(" · ") : "");
      const sub = document.createElement("div");
      sub.className = "meta";
      sub.textContent = shelfLabel(r.deviceTopicKey) + " · " + r.controlId +
        (r.pouredName && r.pouredName !== r.name ? " · на диске " + r.pouredName : "");
      if (r.status === "blocked") sub.className = "meta orphan";
      left.appendChild(title);
      left.appendChild(sub);
      const kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = previewStatusRu(r.status);
      li.appendChild(left);
      li.appendChild(kind);
      if (r.status === "no_card") {
        li.tabIndex = 0;
        li.setAttribute("role", "button");
        const go = () => jumpToContact(r.deviceTopicKey, r.controlId);
        li.addEventListener("click", go);
        li.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            go();
          }
        });
      }
      return li;
    }
    function renderPreview(j) {
      const ul = $("preview");
      const gapsUl = $("gaps");
      ul.innerHTML = "";
      gapsUl.innerHTML = "";
      const rows = j.rows || [];
      const gaps = j.gaps || [];
      $("pour").disabled = true;
      $("previewHead").style.color = "";
      if (!rows.length) {
        $("previewHead").textContent = (j.reason || "Превью. Диск не трогаем.") + " · стол совпадает с диском";
      } else {
        $("previewHead").textContent = (j.reason || "Превью. Диск не трогаем.") + " · " + rows.length + " отличий";
        rows.forEach((r) => ul.appendChild(previewRow(r)));
      }
      $("gapsHead").hidden = !gaps.length;
      $("gapsHead").textContent = gaps.length ? gaps.length + " линий без карточки" : "";
      const gapRows = gaps.map((g) => ({
        ...g,
        title: g.name,
        contacts: [{ deviceTopicKey: g.deviceTopicKey, controlId: g.controlId }],
      }));
      appendRoomList(gapsUl, gapRows, (r) => prettyRoom(String(r.name || "").split(/\s*·\s*/)[0] || ""), previewRow);
      lastGapCount = gaps.length;
      stampBusGaps();
    }
    function stampBusGaps() {
      const bus = $("bus");
      if (!bus) return;
      const base = bus.dataset.base;
      if (!base || !/модулей/.test(base)) return;
      bus.replaceChildren(base);
      if (!lastGapCount) return;
      const go = document.createElement("button");
      go.type = "button";
      go.className = "gapjump";
      go.textContent = lastGapCount + " без карточки";
      go.addEventListener("click", () => {
        setTab("poured");
        requestAnimationFrame(() => {
          const first = [...($("gaps").children || [])].find((n) => n.className !== "roomh");
          (first || $("gapsHead")).scrollIntoView({ block: "start" });
          if (first) first.focus();
        });
      });
      bus.append(" · ", go);
    }
    async function loadPreview() {
      try {
        const r = await fetch("/runtime/desk-pour-preview");
        const j = await r.json();
        if (!j.ok) {
          $("previewHead").style.color = "rgb(var(--bad))";
          $("previewHead").textContent = j.error || "Нет превью";
          return;
        }
        renderPreview(j);
      } catch (e) {
        $("previewHead").style.color = "rgb(var(--bad))";
        $("previewHead").textContent = String(e.message || e);
      }
    }
    function rowSlave(r) {
      const k = (r.contacts && r.contacts[0] && r.contacts[0].deviceTopicKey) || "";
      const m = /_(\d+)$/.exec(k);
      return m ? Number(m[1]) : 0;
    }
    function rowCh(r) {
      const c = (r.contacts && r.contacts[0] && r.contacts[0].controlId) || "";
      return Number((/(\d+)\s*$/.exec(c) || [])[1] || 0);
    }
    function appendRoomList(ul, rows, roomFn, makeRow) {
      const minSlave = {};
      const minCh = {};
      rows.forEach((r) => {
        const room = roomFn(r);
        if (!room) return;
        const s = rowSlave(r);
        const c = rowCh(r);
        if (minSlave[room] == null || s < minSlave[room]) minSlave[room] = s;
        if (minCh[room] == null || c < minCh[room]) minCh[room] = c;
      });
      rows.sort((a, b) => {
        const ra = roomFn(a);
        const rb = roomFn(b);
        const sa = minSlave[ra] ?? 0;
        const sb = minSlave[rb] ?? 0;
        if (sa !== sb) return sa - sb;
        const ca = minCh[ra] ?? 0;
        const cb = minCh[rb] ?? 0;
        if (ca !== cb) return ca - cb;
        if (ra !== rb) return ra.localeCompare(rb, "ru");
        return rowCh(a) - rowCh(b);
      });
      let last = "";
      rows.forEach((r) => {
        const room = roomFn(r);
        if (room && room !== last) {
          const h = document.createElement("li");
          h.className = "roomh";
          h.textContent = room;
          ul.appendChild(h);
          last = room;
        }
        ul.appendChild(makeRow(r, room));
      });
    }
    function titleUnderRoom(title, room) {
      const parts = String(title || "").split(/\s*·\s*/).filter(Boolean);
      const roomLc = String(room || "").toLowerCase();
      const out = parts.filter(
        (p) => p.toLowerCase() !== roomLc && !/^(Channel|Input|K)\s*\d+$/i.test(p),
      );
      return out.join(" · ") || title;
    }
    function pouredRow(r, room) {
      const li = document.createElement("li");
      const left = document.createElement("div");
      const title = document.createElement("div");
      title.textContent = room ? titleUnderRoom(r.title || r.id, room) : (r.title || r.id);
      const sub = document.createElement("div");
      sub.className = "meta";
      const bits = (r.contacts || []).map(contactLine);
      const missing = (r.contacts || []).filter((c) => liveKeys.ready && !liveKeys[c.deviceTopicKey]);
      sub.textContent = bits.join(", ") || "нет контакта на шине";
      if (missing.length) {
        sub.className = "meta orphan";
        sub.textContent = bits.join(", ") + " · нет на этой шине";
      }
      left.appendChild(title);
      left.appendChild(sub);
      const kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = kindRu(r.kind);
      li.appendChild(left);
      li.appendChild(kind);
      return li;
    }
    function renderPoured() {
      const ul = $("poured");
      const marksUl = $("pouredMarks");
      const wrap = $("pouredMarksWrap");
      ul.innerHTML = "";
      marksUl.innerHTML = "";
      const scenarios = pouredRules.filter((r) => r.kind !== "marking");
      const names = pouredRules.filter((r) => r.kind === "marking");
      $("n-poured").textContent = scenarios.length || "";
      if (!pouredRules.length) {
        wrap.hidden = true;
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "На диске пока нет user-правил.";
        ul.appendChild(empty);
        return;
      }
      appendRoomList(ul, scenarios, (r) => prettyRoom(String(r.title || "").split(/\s*·\s*/)[1] || ""), pouredRow);
      wrap.hidden = !names.length;
      $("pouredMarksSum").textContent = names.length + " имён из разметки";
      appendRoomList(marksUl, names, (r) => prettyRoom(String(r.title || "").split(/\s*·\s*/)[0] || ""), pouredRow);
    }
    async function loadHealth() {
      const box = $("health");
      const line = box.querySelector("p");
      try {
        const r = await fetch("/runtime/health");
        const j = await r.json();
        const en = enrollRu(j.enrollment && j.enrollment.state);
        const topics = j.mqttMirror && j.mqttMirror.topicCount;
        const ver = String(j.agentVersion || "").replace(/^.*\./, "");
        box.className = "glass status " + (j.ok ? "ok" : "bad");
        line.textContent = j.ok
          ? "Агент · " + en + (ver ? " · " + ver : "") + (topics != null ? " · " + topics + " топиков" : "")
          : "Агент не ответил";
      } catch (e) {
        box.className = "glass status bad";
        line.textContent = "Нет /runtime/health — откройте этот адрес с машины в сети щита.";
      }
    }
    async function saveMark(body) {
      await fetch("/runtime/desk-marking", {
        method: "PUT",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
      });
      loadPreview();
    }
    async function saveName(key, controlId, name) {
      await saveMark({ deviceTopicKey: key, controlId: controlId, name: name });
    }
    async function saveCards(key, controlId, cards) {
      await saveMark({ deviceTopicKey: key, controlId: controlId, cards: cards });
    }
    function contactKey(key, cid) {
      return String(key) + "::" + String(cid);
    }
    function jumpToContact(key, cid) {
      setTab(familyOf({ deviceTopicKey: key }));
      const want = contactKey(key, cid);
      const go = () => {
        const el = [...document.querySelectorAll("[data-contact]")].find((n) => n.dataset.contact === want);
        if (!el) return;
        const det = el.closest("details");
        if (det) det.open = true;
        el.scrollIntoView({ block: "center" });
        el.classList.add("jump");
        const chip = el.querySelector(".chip");
        if (chip) chip.focus();
        setTimeout(() => el.classList.remove("jump"), 1400);
      };
      requestAnimationFrame(() => requestAnimationFrame(go));
    }
    function channelRow(s, ch, room) {
      const row = document.createElement("li");
      row.dataset.contact = contactKey(s.deviceTopicKey, ch.controlId);
      const knob = document.createElement("span");
      knob.className = "knob";
      knob.textContent = ch.controlId;
      const input = document.createElement("input");
      input.type = "text";
      input.maxLength = 80;
      const loads = Array.isArray(ch.loads) ? ch.loads.filter(Boolean) : [];
      input.placeholder = "Имя контакта";
      const original = String(ch.name || "").trim();
      const pretty = prettyContactName(original);
      const stripped = room ? titleUnderRoom(pretty, room) : pretty;
      input.value = stripped;
      input.setAttribute("aria-label", (s.label || "") + " " + ch.controlId);
      const persist = () => {
        const typed = input.value.trim();
        if (typed === original || typed === pretty || typed === stripped) return;
        const rawRoom = String(original).split(/\s*·\s*/)[0] || "";
        const next = !typed
          ? ""
          : room && rawRoom && typed.toLowerCase().indexOf(rawRoom.toLowerCase()) !== 0
            ? rawRoom + " · " + typed
            : typed;
        if (next === original) return;
        saveName(s.deviceTopicKey, ch.controlId, next).catch(() => {});
      };
      input.addEventListener("change", persist);
      input.addEventListener("blur", persist);
      row.appendChild(knob);
      const grow = document.createElement("div");
      grow.appendChild(input);
      const selected = new Set(Array.isArray(ch.cards) ? ch.cards : []);
      const chips = document.createElement("div");
      chips.className = "chips";
      chips.setAttribute("role", "group");
      chips.setAttribute("aria-label", "Типовая карточка");
      CARDS.forEach((card) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.textContent = card.ru;
        btn.setAttribute("aria-pressed", selected.has(card.id) ? "true" : "false");
        btn.addEventListener("click", () => {
          if (selected.has(card.id)) selected.delete(card.id);
          else selected.add(card.id);
          btn.setAttribute("aria-pressed", selected.has(card.id) ? "true" : "false");
          const hint = grow.querySelector(".loads");
          if (hint && hint.textContent === "на диске нет карточки") {
            if (selected.size) hint.remove();
          } else if (!selected.size && original && !loads.length && (!hint || hint.textContent !== "на диске нет карточки")) {
            const sub = document.createElement("span");
            sub.className = "loads";
            sub.textContent = "на диске нет карточки";
            grow.appendChild(sub);
          }
          saveCards(s.deviceTopicKey, ch.controlId, [...selected]).catch(() => {});
        });
        chips.appendChild(btn);
      });
      grow.appendChild(chips);
      if (loads.length) {
        const sub = document.createElement("span");
        sub.className = "loads";
        sub.textContent = loads.map(prettyContactName).join(" · ");
        grow.appendChild(sub);
      } else if (ch.name && selected.size === 0) {
        const sub = document.createElement("span");
        sub.className = "loads";
        sub.textContent = "на диске нет карточки";
        grow.appendChild(sub);
      }
      row.appendChild(grow);
      return row;
    }
    function ruIdleLight(n) {
      const n10 = n % 10;
      const n100 = n % 100;
      if (n10 === 1 && n100 !== 11) return n + " модуль без разметки";
      if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return n + " модуля без разметки";
      return n + " модулей без разметки";
    }
    function prettyRoom(s) {
      const t = String(s || "").trim();
      if (!t) return "";
      return t.charAt(0).toLocaleUpperCase("ru") + t.slice(1);
    }
    function prettyContactName(name) {
      const t = String(name || "").trim();
      if (!t) return "";
      const parts = t.split(/\s*·\s*/);
      parts[0] = prettyRoom(parts[0]);
      return parts.join(" · ");
    }
    function channelRoom(ch) {
      return prettyRoom(String(ch.name || "").split(/\s*·\s*/)[0] || "");
    }
    function knobNum(ch) {
      return Number((/(\d+)\s*$/.exec(ch.controlId || "") || [])[1] || 0);
    }
    function appendNamedChannels(ul, s, channels) {
      const minCh = {};
      channels.forEach((ch) => {
        const room = channelRoom(ch);
        const n = knobNum(ch);
        if (room && (minCh[room] == null || n < minCh[room])) minCh[room] = n;
      });
      const rows = channels.slice().sort((a, b) => {
        const ra = channelRoom(a);
        const rb = channelRoom(b);
        const d = (minCh[ra] ?? 99) - (minCh[rb] ?? 99);
        if (d) return d;
        const rr = ra.localeCompare(rb, "ru");
        if (rr) return rr;
        return knobNum(a) - knobNum(b);
      });
      let last = "";
      rows.forEach((ch) => {
        const room = channelRoom(ch);
        if (room && room !== last) {
          const h = document.createElement("li");
          h.className = "roomh";
          h.textContent = room;
          ul.appendChild(h);
          last = room;
        }
        ul.appendChild(channelRow(s, ch, room));
      });
    }
    function moduleCard(s, flat) {
      const li = document.createElement("li");
      li.className = "mod";
      const head = document.createElement("div");
      head.className = "head";
      const sku = document.createElement("span");
      sku.className = "sku";
      sku.textContent = s.label || s.deviceTopicKey;
      const meta = document.createElement("span");
      meta.className = "ch";
      meta.textContent = s.hint || (s.channelCount ? s.channelCount + " кан." : "");
      head.appendChild(sku);
      head.appendChild(meta);
      li.appendChild(head);
      const featured = (s.channels || []).filter((c) => c.name || (c.hints && c.hints.length) || (c.cards && c.cards.length));
      const rest = (s.channels || []).filter((c) => !c.name && !(c.hints && c.hints.length) && !(c.cards && c.cards.length));
      if (flat && !featured.length) return li;
      const chs = document.createElement("ul");
      chs.className = "channels";
      appendNamedChannels(chs, s, featured);
      li.appendChild(chs);
      if (rest.length) {
        const det = document.createElement("details");
        det.className = "more";
        const sum = document.createElement("summary");
        sum.textContent = featured.length
          ? "ещё " + rest.length + " без имени"
          : rest.length + " контактов без имени";
        det.appendChild(sum);
        const inner = document.createElement("ul");
        inner.className = "channels";
        rest.forEach((ch) => inner.appendChild(channelRow(s, ch)));
        det.appendChild(inner);
        li.appendChild(det);
      }
      return li;
    }
    function hasFeatured(s) {
      return (s.channels || []).some((c) => c.name || (c.hints && c.hints.length) || (c.cards && c.cards.length));
    }
    function fillList(id, rows, emptyText) {
      const ul = $(id);
      ul.innerHTML = "";
      if (!rows.length) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = emptyText;
        ul.appendChild(p);
        return;
      }
      const live = rows.filter(hasFeatured);
      const idle = rows.filter((s) => !hasFeatured(s));
      live.forEach((s) => ul.appendChild(moduleCard(s)));
      if ((id === "shelves-relays" || id === "shelves-light") && idle.length) {
        const det = document.createElement("details");
        det.className = "more";
        const sum = document.createElement("summary");
        sum.textContent = id === "shelves-relays"
          ? idle.length + " реле без линий в заливке"
          : ruIdleLight(idle.length);
        det.appendChild(sum);
        const inner = document.createElement("ul");
        idle.forEach((s) => inner.appendChild(moduleCard(s, true)));
        det.appendChild(inner);
        ul.appendChild(det);
        return;
      }
      idle.forEach((s) => ul.appendChild(moduleCard(s)));
    }
    function renderShelves(rows) {
      lastShelvesRows = rows || [];
      const split = splitShelves(lastShelvesRows);
      fillList("shelves-light", split.light, "Света на шине нет.");
      fillList("shelves-buttons", split.buttons, "Кнопок на шине нет.");
      fillList("shelves-relays", split.relays, "Реле на шине нет.");
      $("n-light").textContent = split.light.length || "";
      $("n-buttons").textContent = split.buttons.length || "";
      $("n-relays").textContent = split.relays.length || "";
    }
    async function scanNow() {
      $("scan").disabled = true;
      try {
        const r = await fetch("/runtime/mqtt-scan", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ instant: true }),
        });
        const j = await r.json();
        if (!j.ok) {
          if (!lastShelvesRows.length) {
            $("bus").className = "meta bad";
            $("bus").style.color = "rgb(var(--bad))";
            delete $("bus").dataset.base;
          $("bus").textContent = j.error || "Скан не вышел";
          }
          return;
        }
        if (j.shelves && j.shelves.length) showShelves(j);
      } catch (e) {
        if (!lastShelvesRows.length) {
          $("bus").className = "meta";
          $("bus").style.color = "rgb(var(--bad))";
          delete $("bus").dataset.base;
          $("bus").textContent = String(e.message || e);
        }
      } finally {
        $("scan").disabled = false;
      }
    }
    $("scan").onclick = () => { void scanNow(); };
    function showShelves(j) {
      const shelves = j.shelves || [];
      $("bus").className = "meta";
      $("bus").style.color = "";
      const named = shelves.reduce(function (n, s) {
        return n + (s.channels || []).filter(function (c) { return c.source === "rules" && c.name; }).length;
      }, 0);
      const line = shelves.length + " модулей" +
        (j.brokerLabel ? " · " + j.brokerLabel : "") +
        (named ? " · " + named + " имён из разметки" : "");
      $("bus").dataset.base = line;
      $("bus").textContent = line;
      renderShelves(shelves);
      stampBusGaps();
      liveKeys = { ready: true };
      shelves.forEach((s) => { liveKeys[s.deviceTopicKey] = true; });
      renderPoured();
      loadPreview();
      if (shelves.length) $("scan").textContent = "Обновить";
    }
    async function loadPoured() {
      try {
        const r = await fetch("/runtime/desk-poured");
        const j = await r.json();
        if (!j.ok) {
          $("pouredHead").style.color = "rgb(var(--bad))";
          $("pouredHead").textContent = j.error || "Не прочитал залитое";
          return;
        }
        pouredRules = j.rules || [];
        const files = (j.files || []).map((f) => f.filename).join(", ");
        $("pouredHead").style.color = "";
        $("pouredHead").textContent = (j.ruleCount || pouredRules.length) + " правил" +
          (j.revisionId ? " · " + String(j.revisionId).slice(0, 12) : "") +
          (files ? " · " + files : "");
        renderPoured();
        loadPreview();
      } catch (e) {
        $("pouredHead").style.color = "rgb(var(--bad))";
        $("pouredHead").textContent = String(e.message || e);
      }
    }
    async function loadLast() {
      try {
        const r = await fetch("/runtime/mqtt-scan");
        const j = await r.json();
        if (j.ok && j.shelves && j.shelves.length) showShelves(j);
      } catch (_) { /* зеркало ниже */ }
      await scanNow();
    }
    document.querySelectorAll(".tab").forEach((btn) => {
      btn.addEventListener("click", () => setTab(btn.dataset.tab));
    });
    const fromHash = location.hash.replace("#", "");
    if (/^(light|buttons|relays|poured)$/.test(fromHash)) setTab(fromHash);
    loadHealth();
    loadPoured();
    loadLast();
  </script>
</body>
</html>
