<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Пуск · щит</title>
  <link rel="stylesheet" href="/desk.css" />
</head>
<body>
  <main>
    <p class="kicker">Локальный стол · как на Vercel</p>
    <div class="top">
      <h1>Пуск щита</h1>
      <button id="scan" class="ghost" type="button">Обновить</button>
    </div>
    <div id="health" class="glass status">
      <span class="dot" aria-hidden="true"></span>
      <p>Спрашиваю агента…</p>
    </div>
    <p id="bus" class="meta"></p>
    <p id="ritual" class="meta ritual">1 · Разметить → 2 · Типовые → 3 · Залить</p>

    <section id="panel-mark" class="panel glass" data-tab="mark">
      <p class="meta">Комната → каналы → тип. Как «По комнатам» на Vercel.</p>
      <div class="filters" id="markPath" role="tablist" aria-label="Путь разметки">
        <button type="button" data-path="rooms" aria-pressed="true">По комнатам</button>
        <button type="button" data-path="modules" aria-pressed="false">С модулей</button>
      </div>
      <div id="rooms-mark" class="rooms" aria-label="Комнаты"></div>
      <div id="mark-body"></div>
      <div id="modules-body" hidden>
        <div class="filters" id="modFamily" role="tablist" aria-label="Семейство">
          <button type="button" data-fam="light" aria-pressed="true">Свет</button>
          <button type="button" data-fam="buttons" aria-pressed="false">Кнопки</button>
          <button type="button" data-fam="relays" aria-pressed="false">Реле</button>
        </div>
        <div id="shelves-mod" class="vitrine"></div>
      </div>
    </section>

    <section id="panel-cards" class="panel glass" hidden data-tab="cards">
      <p class="meta">2 · Типовые. Карточка → кнопка и линия → на стол → шаг 3 «Залить».</p>
      <p id="diskScenes" class="meta"></p>
      <ul id="deskSols"></ul>
      <div class="filters" id="cardFilters" role="tablist" aria-label="Фильтр карточек"></div>
      <div id="vitrine" class="vitrine"></div>
    </section>
    <button id="cardMask" type="button" hidden aria-label="Закрыть карточку"></button>
    <div id="cardSheet" class="sheet" hidden></div>

    <section id="panel-poured" class="panel glass" hidden data-tab="poured">
      <p id="previewHead" class="meta">Сравниваю стол с диском…</p>
      <p id="pouredHead" class="meta">Спрашиваю залитое…</p>
      <div class="filters" id="pouredTabs" role="tablist" aria-label="Полки заливки"></div>
      <p id="pourHint" class="meta" hidden></p>
      <p id="pourWrap" class="pour-row" hidden>
        <button id="pourNames" class="ghost" type="button" disabled>Залить имена</button>
        <button id="pourRules" class="ghost" type="button" disabled>Залить сценарии</button>
        <button id="pour" class="ghost" type="button" disabled hidden>Убрать дубли</button>
      </p>
      <div id="ready"></div>
      <ul id="preview" hidden></ul>
      <p id="gapsHead" class="meta" hidden></p>
      <ul id="gaps" hidden></ul>
      <ul id="poured" hidden></ul>
      <details id="pouredMarksWrap" class="more" hidden>
        <summary id="pouredMarksSum"></summary>
        <ul id="pouredMarks"></ul>
      </details>
    </section>
  </main>
  <nav class="dock" role="tablist" aria-label="Ритуал пуска">
    <button class="tab" type="button" role="tab" data-tab="mark" aria-selected="true">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h12"/></svg></span>
      <span>Разметить <span class="n" id="n-mark"></span></span>
    </button>
    <button class="tab" type="button" role="tab" data-tab="cards" aria-selected="false">
      <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
      <span>Типовые <span class="n" id="n-cards"></span></span>
    </button>
    <button class="tab" type="button" role="tab" data-tab="poured" aria-selected="false">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 20V8"/><path d="m6 14 6 6 6-6"/><path d="M4 4h16"/></svg></span>
      <span>Залить <span class="n" id="n-poured"></span></span>
    </button>
  </nav>
  <script src="/desk.js" defer></script>
</body>
</html>
