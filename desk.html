<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Пуск · щит</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: #0c0c0e; color: #eee; }
    main { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .35rem; }
    .muted { color: #9a9aa3; font-size: .85rem; }
    button { appearance: none; border: 0; border-radius: 999px; padding: .55rem 1rem; background: #f4f4f5; color: #111; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .45; cursor: wait; }
    .card { margin-top: 1rem; padding: 1rem 1.1rem; border-radius: 1rem; background: #16161a; border: 1px solid #2a2a30; }
    .ok { color: #8ee0b0; }
    .bad { color: #f0a0a0; }
    ul { list-style: none; margin: .75rem 0 0; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .55rem 0; border-top: 1px solid #2a2a30; }
    li:first-child { border-top: 0; }
    .meta { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: .1rem; }
    input[type="text"] { width: 100%; box-sizing: border-box; border: 0; background: transparent; color: #eee; font: inherit; padding: 0; outline: none; }
    input[type="text"]::placeholder { color: #eee; }
    input[type="text"]:focus { color: #fff; }
    .sku { color: #9a9aa3; font-size: .75rem; }
    .ch { color: #9a9aa3; font-size: .8rem; white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <p class="muted">Локальный стол · как HA на :8123</p>
    <h1>Пусконаладка щита</h1>
    <p class="muted">Имя полки пишется на щите и переживает перезапуск. Заливку rules не делаем.</p>
    <p style="margin-top:1rem"><button id="scan" type="button">Снять шину</button></p>
    <div class="card">
      <p id="health" class="muted">Спрашиваю агента…</p>
    </div>
    <div class="card">
      <p id="bus" class="muted">Шина ещё не снимали.</p>
      <ul id="shelves"></ul>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    async function loadHealth() {
      try {
        const r = await fetch("/runtime/health");
        const j = await r.json();
        const en = j.enrollment && j.enrollment.state ? j.enrollment.state : "—";
        const topics = j.mqttMirror && j.mqttMirror.topicCount;
        $("health").className = j.ok ? "ok" : "bad";
        $("health").textContent = j.ok
          ? "Агент на щите · enroll " + en + (topics != null ? " · зеркало " + topics + " топиков" : "")
          : "Агент не ответил";
      } catch (e) {
        $("health").className = "bad";
        $("health").textContent = "Нет /runtime/health — откройте этот адрес с машины в сети щита.";
      }
    }
    async function saveName(key, name) {
      await fetch("/runtime/desk-marking", {
        method: "PUT",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ deviceTopicKey: key, name: name }),
      });
    }
    function renderShelves(rows) {
      const ul = $("shelves");
      ul.innerHTML = "";
      (rows || []).forEach((s) => {
        const li = document.createElement("li");
        const meta = document.createElement("div");
        meta.className = "meta";
        const input = document.createElement("input");
        input.type = "text";
        input.maxLength = 80;
        input.placeholder = s.label || s.deviceTopicKey;
        input.value = s.name || "";
        input.setAttribute("aria-label", "Имя " + (s.label || s.deviceTopicKey));
        input.addEventListener("change", () => {
          saveName(s.deviceTopicKey, input.value).catch(() => {});
        });
        const sku = document.createElement("span");
        sku.className = "sku";
        sku.textContent = s.label || "";
        meta.appendChild(input);
        meta.appendChild(sku);
        const ch = document.createElement("span");
        ch.className = "ch";
        ch.textContent = s.hint || (s.channelCount ? s.channelCount + " кан." : "");
        li.appendChild(meta);
        li.appendChild(ch);
        ul.appendChild(li);
      });
    }
    $("scan").onclick = async () => {
      $("scan").disabled = true;
      $("bus").textContent = "Снимаю шину…";
      $("bus").className = "muted";
      $("shelves").innerHTML = "";
      try {
        const r = await fetch("/runtime/mqtt-scan", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ scanMs: 8000 }),
        });
        const j = await r.json();
        if (!j.ok) {
          $("bus").className = "bad";
          $("bus").textContent = j.error || "Скан не вышел";
          return;
        }
        const shelves = j.shelves || [];
        $("bus").className = "ok";
        $("bus").textContent = "На шине " + shelves.length + " модулей" +
          (j.brokerLabel ? " · " + j.brokerLabel : "");
        renderShelves(shelves);
      } catch (e) {
        $("bus").className = "bad";
        $("bus").textContent = String(e.message || e);
      } finally {
        $("scan").disabled = false;
      }
    };
    loadHealth();
  </script>
</body>
</html>
